<title>Little House</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;background:#cdeafc;font-family:Inter,system-ui,sans-serif;touch-action:none}
body.night{background:#1e2d63}
#stage{position:fixed;inset:0;width:100%;height:100%}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
.brand{font:500 24px Fraunces,Georgia,serif;color:#2a2320;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.brand small{display:block;font:600 10px Inter;letter-spacing:.2em;text-transform:uppercase;color:#6b5f55;margin-top:3px}
body.night .brand{color:#f3ecdc;text-shadow:none}body.night .brand small{color:#a9b6e0}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 74px);background:rgba(255,255,255,.9);color:#2a2320;font:600 13px Inter;padding:10px 16px;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.12);transition:opacity .6s;pointer-events:none;white-space:nowrap;max-width:92vw}
#hint.off{opacity:0}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:0 10px calc(env(safe-area-inset-bottom) + 14px);pointer-events:none}
.b{pointer-events:auto;flex:0 1 80px;min-width:56px;height:64px;border:0;border-radius:20px;background:rgba(255,252,245,.94);color:#2a2320;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px Inter;letter-spacing:.04em;box-shadow:0 6px 20px rgba(60,40,20,.18);cursor:pointer;transition:transform .15s,background .3s}
.b:active{transform:scale(.94)}.b svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.b.on{background:#2a3566;color:#ffe9a8}.b:disabled{opacity:.45}
body.night .b{background:rgba(24,34,72,.92);color:#e8eefc}body.night .b.on{background:#ffe9a8;color:#2a3566}
.rooms{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;gap:14px;justify-content:center;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}
.rooms.on{opacity:1;pointer-events:auto;transform:none}
.rb{width:60px;height:60px;border-radius:50%;border:4px solid #fff;background:var(--c);box-shadow:0 6px 18px rgba(60,40,20,.28);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.rb svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.rb.cur{outline:3px solid #2a3566;outline-offset:2px}.rb:active{transform:scale(.92)}
.b{position:relative}.dot{position:absolute;top:8px;right:10px;width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);background:#f1c14c}
@media(max-height:480px){.brand small,#hint{display:none}.b{height:52px}}

<div class="bar">
<button class="b" id="bRoom"><svg viewBox="0 0 24 24"><path d="M5 3h11v18H5zM16 12h5M18.5 9.5L21 12l-2.5 2.5M11 12v.01"/></svg><span>Rooms</span><i class="dot" id="roomDot"></i></button>
<button class="b" id="bLights"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Lights</span></button>
<button class="b" id="bNight"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Night</span></button>
<button class="b" id="bTurn"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4"/></svg><span>Turn</span></button>
<button class="b" id="bTidy"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg><span>Tidy</span></button>
</div>
